<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>vibeGTA — a voxel city</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #05070c; font-family: 'Segoe UI', system-ui, sans-serif; }
  #overlay {
    position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column;
    align-items: center; justify-content: center; cursor: pointer; text-align: center;
    background: radial-gradient(ellipse at 50% 35%, rgba(10,18,34,.55), rgba(3,5,10,.88));
    backdrop-filter: blur(2px); color: #e8eef6;
  }
  #overlay h1 {
    margin: 0; font-size: 74px; font-weight: 900; letter-spacing: 10px;
    background: linear-gradient(180deg, #fff 20%, #9fc4ff 55%, #3b5f9e 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    filter: drop-shadow(0 3px 14px rgba(70,120,220,.35));
  }
  #overlay .sub { margin: 6px 0 26px; font-size: 15px; letter-spacing: 3px; color: #8fa8c9; text-transform: uppercase; }
  #overlay .card {
    background: rgba(8,13,24,.6); border: 1px solid rgba(120,160,230,.22);
    border-radius: 10px; padding: 18px 30px; max-width: 520px;
  }
  #overlay .row { display: flex; justify-content: space-between; gap: 18px; font-size: 13.5px; margin: 5px 0; color: #b9c8de; }
  #overlay .row b { color: #fff; font-weight: 600; }
  #overlay .play {
    margin-top: 22px; font-size: 15px; font-weight: 700; letter-spacing: 4px;
    color: #fff; text-shadow: 0 0 18px rgba(120,180,255,.8); animation: pulse 2s infinite;
  }
  @keyframes pulse { 50% { opacity: .55; } }
  #crosshair {
    position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; z-index: 10;
    transform: translate(-50%,-50%); pointer-events: none;
    background: rgba(255,255,255,.85); border-radius: 50%;
    box-shadow: 0 0 0 1.5px rgba(0,0,0,.5); mix-blend-mode: difference;
    opacity: 0; transition: opacity .3s;
  }
  #busted {
    position: fixed; left: 50%; top: 38%; transform: translate(-50%,-50%); z-index: 14;
    font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 64px; font-weight: 900;
    letter-spacing: 12px; color: #ff4a3a; text-shadow: 0 0 24px rgba(255,60,40,.8), 0 2px 0 #000;
    display: none; pointer-events: none;
  }
  #hint {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 12;
    font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 13px;
    color: #ffe9a0; text-shadow: 0 1px 3px rgba(0,0,0,.9);
    background: rgba(6,10,18,.45); border: 1px solid rgba(120,160,230,.18);
    border-radius: 8px; padding: 6px 14px; display: none; pointer-events: none; white-space: nowrap;
  }
  #status {
    position: fixed; top: 14px; right: 14px; z-index: 12; text-align: right;
    font-family: ui-monospace, 'Cascadia Mono', monospace; font-size: 12px; line-height: 1.5;
    color: #cfe0f5; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none;
    background: rgba(6,10,18,.35); border: 1px solid rgba(120,160,230,.14);
    border-radius: 8px; padding: 8px 12px; display: none;
  }
</style>
</head>
<body>
<div id="overlay">
  <h1>VIBEGTA</h1>
  <div class="sub">a voxel city that breaks</div>
  <div class="card">
    <div class="row"><b>W A S D</b><span>move</span></div>
    <div class="row"><b>Mouse</b><span>look</span></div>
    <div class="row"><b>Shift</b><span>sprint</span></div>
    <div class="row"><b>Space</b><span>jump</span></div>
    <div class="row"><b>Left click</b><span>break blocks</span></div>
    <div class="row"><b>Esc</b><span>pause</span></div>
    <div class="row"><b>E</b><span>steal / exit car</span></div>
    <div style="margin-top:10px;font-size:12px;color:#7d92b4">roads &amp; sidewalks are indestructible. the rest is not.</div>
  </div>
  <div class="play">— click to play —</div>
</div>
<div id="crosshair"></div>
<div id="status"></div>
<div id="busted">BUSTED</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.js" } }

<script type="module">
import * as THREE from 'three';

/* ================================================================
 * renderer / scene
 * ================================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x6a8fc2, 0.0016);
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1500);

/* ================================================================
 * voxel world: 256 x 48 x 256
 *   city grid: 4 x 4 blocks of 44 m separated by 16 m roads (5 roads)
 *   everything is procedural + seedless-deterministic: every client
 *   (and the server's edit history) agrees on the original world
 * ================================================================ */
const WORLD = 256, HEIGHT = 48;
const ROAD_W = 16, BLOCK_W = 44, GRID = 4;
const idx = (x, y, z) => (y * WORLD * WORLD) | (x * WORLD) | z;
const inB = (x, y, z) => x >= 0 && z >= 0 && x < WORLD && z < WORLD && y >= 0 && y < HEIGHT;
const world = new Uint8Array(WORLD * WORLD * HEIGHT);
const getB = (x, y, z) => (inB(x, y, z) ? world[idx(x, y, z)] : (y < 0 ? T.STONE : 0));

const T = {
  AIR: 0, GRASS: 1, DIRT: 2, STONE: 3, ASPHALT: 4, SIDEWALK: 5,
  BRICK: 6, PLASTER: 7, GLASS: 8, ROOF: 9, TRUNK: 10, LEAVES: 11,
  POLE: 12, LAMP: 13, ASPH_X: 14, ASPH_Z: 15,
};
const DESTRUCTIBLE = { [T.GRASS]:1, [T.DIRT]:1, [T.STONE]:1, [T.BRICK]:1, [T.PLASTER]:1,
  [T.GLASS]:1, [T.ROOF]:1, [T.TRUNK]:1, [T.LEAVES]:1, [T.POLE]:1, [T.LAMP]:1 };
// roads (ASPHALT / ASPH_X / ASPH_Z) and SIDEWALK are NOT destructible
const setB = (x, y, z, v) => { if (inB(x, y, z)) world[idx(x, y, z)] = v; };
const solid = b => b !== T.AIR;

// deterministic rng for world gen (identical on every client)
let _s = 987654321 ^ 1337;
const rng = () => { _s = (_s * 1103515245 + 12345) & 0x7fffffff; return _s / 0x80000000; };
const rr = (a, b) => a + (b - a) * rng();
const ri = (a, b) => Math.floor(rr(a, b + 1));

// layout helpers: road/ block boundaries (period 60 = 16 road + 44 block)
const blockStart = i => i * (BLOCK_W + ROAD_W) + ROAD_W;   // 16, 120, 180, 240

/* ------------------------------ block placement ---------------------------- */
function placeTree(x, z, baseY) {
  const h = ri(4, 6);
  for (let y = baseY + 1; y <= baseY + h; y++) setB(x, y, z, T.TRUNK);
  const ly = baseY + h;
  for (let dy = 0; dy < 4; dy++)
    for (let dx = -3; dx <= 3; dx++)
      for (let dz = -3; dz <= 3; dz++) {
        const r = 3 - (dy * 0.6);
        if (dx * dx + dz * dz > r * r * 2.6 + 1.5) continue;
        if (dy === 3 && Math.abs(dx) > 1 && Math.abs(dz) > 1) continue;
        setB(x + dx, ly + dy, z + dz, T.LEAVES);
      }
}
function placeLamp(x, z, baseY) {
  for (let y = baseY + 1; y <= baseY + 5; y++) setB(x, y, z, T.POLE);
  setB(x, baseY + 6, z, T.LAMP);
}
function placeBush(x, z, y) {
  for (let dy = 0; dy < 2; dy++)
    for (let dx = -1; dx <= 1; dx++)
      for (let dz = -1; dz <= 1; dz++)
        if (!(dx && dz && dy === 1) && !(Math.abs(dx) === 1 && Math.abs(dz) === 1))
          setB(x + dx, y + dy, z + dz, T.LEAVES);
}

function buildBuilding(bx, bz) {
  const W = ri(14, 22) & ~1, D = ri(14, 22) & ~1, H = ri(11, 34);
  const x0 = bx + ((38 - W) >> 1), z0 = bz + ((38 - D) >> 1);
  const wall = rng() < 0.5 ? T.BRICK : T.PLASTER;
  const doorSide = ri(0, 3);          // 0 +x, 1 -x, 2 +z, 3 -z
  const doorC = W >> 1;               // center of the facade
  // shell (ground floor starts at y=4, the lot/sidewalk level)
  for (let y = 4; y <= H; y++) {
    for (let x = x0; x < x0 + W; x++)
      for (let z = z0; z < z0 + D; z++) {
        const ex = x === x0 || x === x0 + W - 1;
        const ez = z === z0 || z === z0 + D - 1;
        if (!ex && !ez) continue;
        const ox = x - x0, oz = z - z0;
        let b = wall;
        // upper floors: curtain-wall window grid (frame every 4th col / 3rd row)
        if (y >= 8 && (ox % 4 !== 0) && (y % 3 !== 1) && (oz % 4 !== 0)) b = T.GLASS;
        // ground floor: storefront — big glass band along the facades
        if ((y === 4 || y === 5) && ((ex && oz % 3 !== 0) || (ez && ox % 3 !== 0))) b = T.GLASS;
        // door: 2 wide x 3 tall opening on one facade
        if (doorSide === 0 && ex && x === x0 + W - 1 && oz >= doorC && oz < doorC + 2 && y <= 6) b = T.AIR;
        if (doorSide === 1 && ex && x === x0 && oz >= doorC && oz < doorC + 2 && y <= 6) b = T.AIR;
        if (doorSide === 2 && ez && z === z0 + D - 1 && ox >= doorC && ox < doorC + 2 && y <= 6) b = T.AIR;
        if (doorSide === 3 && ez && z === z0 && ox >= doorC && ox < doorC + 2 && y <= 6) b = T.AIR;
        setB(x, y, z, b);
      }
  }
  // interior slabs (open-plan floors every 4 m)
  for (let f = 8; f <= H - 4; f += 4)
    for (let x = x0 + 1; x < x0 + W - 1; x++)
      for (let z = z0 + 1; z < z0 + D - 1; z++)
        setB(x, f, z, T.SIDEWALK);
  // roof slab + parapet
  for (let x = x0; x < x0 + W; x++)
    for (let z = z0; z < z0 + D; z++) setB(x, H, z, T.ROOF);
  for (let x = x0; x < x0 + W; x++) { setB(x, H + 1, z0, T.ROOF); setB(x, H + 1, z0 + D - 1, T.ROOF); }
  for (let z = z0; z < z0 + D; z++) { setB(x0, H + 1, z, T.ROOF); setB(x0 + W - 1, H + 1, z, T.ROOF); }
  // rooftop boxes (HVAC / water)
  const nBoxes = ri(1, 3);
  for (let k = 0; k < nBoxes; k++) {
    const bx2 = ri(x0 + 2, x0 + W - 4), bz2 = ri(z0 + 2, z0 + D - 4), bh = ri(1, 2);
    for (let dx = 0; dx < ri(2, 4); dx++)
      for (let dz = 0; dz < ri(2, 4); dz++)
        for (let dy = 0; dy <= bh; dy++) setB(bx2 + dx, H + 1 + dy, bz2 + dz, T.SIDEWALK);
  }
}

function generateWorld() {
  // terrain: stone floor, dirt, then roads / sidewalks / building lots
  for (let x = 0; x < WORLD; x++)
    for (let z = 0; z < WORLD; z++) {
      setB(x, 0, z, T.STONE);
      setB(x, 1, z, T.DIRT);
      const xR = (x % 60) < ROAD_W, zR = (z % 60) < ROAD_W;
      if (xR && zR) {
        setB(x, 2, z, T.ASPHALT);                       // intersection
      } else if (!xR && !zR) {
        const ox = x % 60 - ROAD_W, oz = z % 60 - ROAD_W;
        const side = ox < 3 || ox >= BLOCK_W - 3 || oz < 3 || oz >= BLOCK_W - 3;
        if (side) { setB(x, 2, z, T.SIDEWALK); setB(x, 3, z, T.SIDEWALK); }
        else { setB(x, 2, z, T.GRASS); setB(x, 3, z, T.GRASS); }   // lot raised to curb level
      } else if (!xR && zR) {
        // horizontal road (runs along x): dashed centre line
        setB(x, 2, z, (z % 60) === 8 ? T.ASPH_X : T.ASPHALT);
      } else {
        // vertical road (runs along z): dashed centre line
        setB(x, 2, z, (x % 60) === 8 ? T.ASPH_Z : T.ASPHALT);
      }
    }
  // blocks: buildings / parks
  for (let i = 0; i < GRID; i++)
    for (let j = 0; j < GRID; j++) {
      const bx = blockStart(i), bz = blockStart(j);
      // streetlamps at the four sidewalk corners
      placeLamp(bx + 1, bz + 1, 4);
      placeLamp(bx + BLOCK_W - 2, bz + 1, 4);
      placeLamp(bx + 1, bz + BLOCK_W - 2, 4);
      placeLamp(bx + BLOCK_W - 2, bz + BLOCK_W - 2, 4);
      // corner trees + bushes on the sidewalks
      if (rng() < 0.75) placeTree(bx + 5, bz + 5, 4);
      if (rng() < 0.75) placeTree(bx + BLOCK_W - 6, bz + BLOCK_W - 6, 4);
      if (rng() < 0.6) placeBush(bx + 8, bz + 4, 4);
      if (rng() < 0.6) placeBush(bx + BLOCK_W - 9, bz + BLOCK_W - 5, 4);
      const park = rng() < 0.12;
      if (park) {
        const n = ri(3, 5);
        for (let k = 0; k < n; k++)
          placeTree(bx + ri(9, BLOCK_W - 10), bz + ri(9, BLOCK_W - 10), 4);
      } else {
        buildBuilding(bx, bz);
      }
    }
}

/* ================================================================
 * textures (procedural 16 px tiles on a 128 px atlas)
 * ================================================================ */
const TILE = 16, ATLAS = 128;
const atlasCanvas = document.createElement('canvas');
atlasCanvas.width = ATLAS; atlasCanvas.height = ATLAS;
const actx = atlasCanvas.getContext('2d');
const aimg = actx.createImageData(ATLAS, ATLAS);

function px(gx, gy, r, g, b, a = 255) {
  const p = ((gy * ATLAS + gx) << 2);
  aimg.data[p] = r; aimg.data[p + 1] = g; aimg.data[p + 2] = b; aimg.data[p + 3] = a;
}
// noise helper: base color +- jitter, deterministic per pixel
const hsh = (x, y) => { const n = Math.sin(x * 12.9898 + y * 78.233) * 43758.5453; return n - Math.floor(n); };
function noiseTile(tx, ty, base, jit) {
  const [r, g, b] = base;
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(tx * 16 + x, ty * 16 + y) - 0.5) * 2 * jit;
      px(tx * 16 + x, ty * 16 + y,
        Math.max(0, Math.min(255, r + n)), Math.max(0, Math.min(255, g + n)), Math.max(0, Math.min(255, b + n)));
    }
}
function tileXY(t) { return [t % 8, (t / 8) | 0]; }

// build atlas tiles
{
  const [tx, ty] = tileXY(0); noiseTile(tx, ty, [74, 134, 58], 18);          // grass
  const [tx1, ty1] = tileXY(1); noiseTile(tx1, ty1, [122, 92, 58], 22);      // dirt
  const [tx16, ty16] = tileXY(16);                                            // grass side
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(tx16 * 16 + x, ty16 * 16 + y) - 0.5) * 44;
      if (y < 3) px(tx16 * 16 + x, ty16 * 16 + y, 74 + n, 134 + n, 58 + n);
      else px(tx16 * 16 + x, ty16 * 16 + y, 122 + n, 92 + n, 58 + n);
    }
  const [t2x, t2y] = tileXY(2); noiseTile(t2x, t2y, [112, 114, 118], 16);    // stone
  const [t3x, t3y] = tileXY(3); noiseTile(t3x, t3y, [40, 42, 46], 9);        // asphalt
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) {                // faint cracks
    if (hsh(t3x * 16 + x * 3, t3y * 16 + y * 3) > 0.93)
      px(t3x * 16 + x, t3y * 16 + y, 58, 60, 64);
  }
  const [t4x, t4y] = tileXY(4); noiseTile(t4x, t4y, [40, 42, 46], 9);        // asphalt + x-dashes
  for (let x = 0; x < 16; x++) for (const y of [7, 8])
    if (x % 4 < 2) px(t4x * 16 + x, t4y * 16 + y, 214, 196, 92);
  const [t5x, t5y] = tileXY(5); noiseTile(t5x, t5y, [40, 42, 46], 9);        // asphalt + z-dashes
  for (let y = 0; y < 16; y++) for (const x of [7, 8])
    if (y % 4 < 2) px(t5x * 16 + x, t5y * 16 + y, 214, 196, 92);
  const [t6x, t6y] = tileXY(6);                                               // sidewalk
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(t6x * 16 + x, t6y * 16 + y) - 0.5) * 26;
      let r = 158 + n, g = 160 + n, b = 162 + n;
      if (x === 0 || y === 0) { r -= 34; g -= 34; b -= 34; }
      px(t6x * 16 + x, t6y * 16 + y, r, g, b);
    }
  const [t7x, t7y] = tileXY(7);                                               // brick
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const by = (y >> 1), off = (by & 1) ? 4 : 0;
      const joint = (y === 0) || (((x + off) % 8) === 0);
      const n = (hsh(t7x * 16 + x, t7y * 16 + y) - 0.5) * 20;
      if (joint) px(t7x * 16 + x, t7y * 16 + y, 96, 84, 74);
      else px(t7x * 16 + x, t7y * 16 + y, 148 + n, 74 + n, 58 + n);
    }
  const [t8x, t8y] = tileXY(8);                                               // plaster
  noiseTile(t8x, t8y, [196, 188, 168], 10);
  for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++)
    if (hsh(t8x * 16 + x * 2, t8y * 16 + y * 2) > 0.94) px(t8x * 16 + x, t8y * 16 + y, 178, 170, 150);
  const [t9x, t9y] = tileXY(9);                                               // glass
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const streak = hsh(t9x * 16 + ((x + y * 3) & 15), t9y * 16) > 0.82 ? 26 : 0;
      const frame = x === 0 || y === 0 || x === 15 || y === 15;
      if (frame) px(t9x * 16 + x, t9y * 16 + y, 52, 66, 78);
      else px(t9x * 16 + x, t9y * 16 + y, 120 + streak, 158 + streak, 188 + streak);
    }
  const [t10x, t10y] = tileXY(10);                                            // roof
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(t10x * 16 + x, t10y * 16 + y) - 0.5) * 14;
      const seam = (y % 4 === 0) || (((x + ((y >> 2) & 1) * 4) % 8) === 0);
      if (seam) px(t10x * 16 + x, t10y * 16 + y, 52, 54, 58 + n);
      else px(t10x * 16 + x, t10y * 16 + y, 88 + n, 90 + n, 96 + n);
    }
  const [t11x, t11y] = tileXY(11);                                            // trunk
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const stripe = hsh(t11x * 16 + (x & ~3) + 1, 5) > 0.5 ? 14 : -14;
      const n = (hsh(t11x * 16 + x, t11y * 16 + y) - 0.5) * 10;
      px(t11x * 16 + x, t11y * 16 + y, 104 + stripe + n, 78 + stripe + n, 50 + stripe + n);
    }
  const [t12x, t12y] = tileXY(12);                                            // leaves
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(t12x * 16 + x, t12y * 16 + y) - 0.5) * 40;
      const hole = hsh(t12x * 16 + x * 2, t12y * 16 + y * 2) > 0.9;
      if (hole) px(t12x * 16 + x, t12y * 16 + y, 30, 58, 26);
      else px(t12x * 16 + x, t12y * 16 + y, 44 + n, 96 + n, 40 + n);
    }
  const [t13x, t13y] = tileXY(13);                                            // lamp pole
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) {
      const n = (hsh(t13x * 16 + x, t13y * 16 + y) - 0.5) * 8;
      let r = 40 + n, g = 42 + n, b = 46 + n;
      if (x > 4 && x < 11) { r += 8; g += 8; b += 10; }
      px(t13x * 16 + x, t13y * 16 + y, r, g, b);
    }
  const [t14x, t14y] = tileXY(14);                                            // lamp head (bright)
  for (let y = 0; y < 16; y++)
    for (let x = 0; x < 16; x++) px(t14x * 16 + x, t14y * 16 + y, 255, 224, 158);
  actx.putImageData(aimg, 0, 0);
}
const atlasTex = new THREE.CanvasTexture(atlasCanvas);
atlasTex.magFilter = THREE.NearestFilter;
atlasTex.minFilter = THREE.NearestFilter;
atlasTex.colorSpace = THREE.SRGBColorSpace;
atlasTex.generateMipmaps = false;

const matSolid = new THREE.MeshLambertMaterial({ map: atlasTex, vertexColors: true });
const matGlass = new THREE.MeshLambertMaterial({
  map: atlasTex, vertexColors: true, transparent: true, opacity: 0.62,
  emissive: new THREE.Color(1, 0.82, 0.5), emissiveIntensity: 0,
  side: THREE.DoubleSide,
});
const matGlow = new THREE.MeshBasicMaterial({ map: atlasTex });

// per-type: [top tile, side tile, bottom tile, vertex-color tint]
const TILEMAP = {
  [T.GRASS]: [0, 16, 1, [1, 1, 1]],
  [T.DIRT]: [1, 1, 1, [1, 1, 1]],
  [T.STONE]: [2, 2, 2, [1, 1, 1]],
  [T.ASPHALT]: [3, 3, 3, [1, 1, 1]],
  [T.ASPH_X]: [4, 3, 3, [1, 1, 1]],
  [T.ASPH_Z]: [5, 3, 3, [1, 1, 1]],
  [T.SIDEWALK]: [6, 6, 6, [1, 1, 1]],
  [T.BRICK]: [7, 7, 7, [1, 1, 1]],
  [T.PLASTER]: [8, 8, 8, [1, 1, 1]],
  [T.GLASS]: [9, 9, 9, [1, 1, 1]],
  [T.ROOF]: [10, 10, 10, [1, 1, 1]],
  [T.TRUNK]: [11, 11, 11, [1, 1, 1]],

      nrm[o] = arr.N[t * 3]; nrm[o + 1] = arr.N[t * 3 + 1]; nrm[o + 2] = arr.N[t * 3 + 2];
      col[o] = arr.C[t * 3]; col[o + 1] = arr.C[t * 3 + 1]; col[o + 2] = arr.C[t * 3 + 2];

function buildChunk(cx, cz) {

function updateEnvironment(dt) {
  simTime += dt;
  const hour = (10 + simTime * 24 / 480) % 24;   // full day = 8 minutes
  const a = ((hour - 6) / 12) * Math.PI;
  sunE = Math.sin(a);

  nightF = THREE.MathUtils.smoothstep(-sunE, -0.05, 0.25);
  sunDir.set(Math.cos(a) * 0.9, Math.max(0.08, sunE), -0.35).normalize();

  // weather mix
  weather.timer -= dt;

  const m = weather.mix, c = weather.cur, t = weather.target;
  const mixv = WEATHERS[c].fog + (WEATHERS[t].fog - WEATHERS[c].fog) * m;

  // sky color
  _tmpA.copy(_cNight).lerp(_cDay, dayF);

  _tmpA.lerp(_cWarm, warmAmt * dayF);

  const tGray = t === 'rain' ? 1 : t === 'snow' ? 0.55 : t === 'fog' ? 0.85 : 0;
  const g = Math.max(0, Math.min(1, cGray + (tGray - cGray) * m));
  if (g > 0) _tmpA.lerp(_tmpB.set(0x7f8894).multiplyScalar(0.9 + 0.1 * dayF), g * 0.7);

  scene.fog.color.copy(skyColor);
  scene.fog.density = mixv;
  scene.background = skyColor;

  // lights
  const sunI = Math.max(0, sunE) * (1.5 - 0.55 * g);
  sun.intensity = sunI;
  hemi.intensity = 0.25 + dayF * 0.75 - g * 0.15;
  hemi.color.setRGB(0.5 + 0.4 * dayF, 0.6 + 0.35 * dayF, 0.75 + 0.25 * dayF);
  sun.position.copy(player.pos).addScaledVector(sunDir, 160);
  sun.target.position.copy(player.pos);
  sun.target.updateMatrixWorld();
  sunSprite.position.copy(player.pos).addScaledVector(sunDir, 900);
  sunSprite.material.opacity = Math.max(0, Math.min(1, sunE * 3)) * (1 - g * 0.6);
  moonSprite.position.copy(player.pos).addScaledVector(sunDir, -900);
  moonSprite.position.y = player.pos.y + 400;
  moonSprite.material.opacity = nightF * (1 - g);
  window.__stars.material.opacity = nightF * (1 - g);
  window.__stars.position.copy(player.pos);

  // city lights: windows + streetlamps
  matGlass.emissiveIntensity = nightF * 0.5 * (1 - g * 0.5);
  _tmpA.set(0x2a2c30).lerp(_tmpB.set(0xffd9a0), nightF);
  matGlow.color.copy(_tmpA);

  // clouds drift & are lit by the sky
  for (const cl of clouds) {
    cl.position.x += cl.userData.speed * dt;
    if (cl.position.x > 500) cl.position.x = -160;
    cl.material.color.setScalar(0.35 + 0.65 * dayF);
  }

  // particles
  const rp = rain.geometry.attributes.position.array;
  const sp = snow.geometry.attributes.position.array;
  const rainOn = weather.target === 'rain', snowOn = weather.target === 'snow';
  rain.material.opacity += ((rainOn ? 0.6 : 0) - rain.material.opacity) * (1 - Math.exp(-1.5 * dt));
  snow.material.opacity += ((snowOn ? 0.9 : 0) - snow.material.opacity) * (1 - Math.exp(-1.5 * dt));
  const px0 = player.pos;
  if (rain.material.opacity > 0.01) for (let i = 0; i < rp.length / 3; i++) {
    rp[i * 3 + 1] -= (24 + (i % 7)) * dt;
    rp[i * 3] += 4 * dt;
    if (rp[i * 3 + 1] < px0.y - 4) {
      rp[i * 3] = px0.x - 35 + Math.random() * 70;
      rp[i * 3 + 1] = px0.y + 36 + Math.random() * 10;
      rp[i * 3 + 2] = px0.z - 35 + Math.random() * 70;

  rain.geometry.attributes.position.needsUpdate = true;
  if (snow.material.opacity > 0.01) for (let i = 0; i < sp.length / 3; i++) {
    sp[i * 3 + 1] -= 1.6 * dt;

  const wet = 1 - 0.18 * g;
  matSolid.color.setRGB(wet, wet, wet);

  const hs = Math.hypot(player.vel.x, player.vel.z);
  player.speed = hs;
  const moving = hs > 0.5 && player.onGround;
  if (moving) player.phase += hs * dt * 1.9;
  const sw = Math.sin(player.phase) * Math.min(1, hs / 5) * (player.onGround ? 1 : 0.2);
  rig.legL.rotation.x = sw * 0.95;
  rig.legR.rotation.x = -sw * 0.95;
  rig.armL.rotation.x = -sw * 0.65;
  rig.armR.rotation.x = sw * 0.65;
  rig.body.position.y = Math.abs(Math.sin(player.phase * 2)) * 0.05 * Math.min(1, hs / 4);

  // place rig: face movement direction (clamped so walking backwards
  // looks natural instead of a full 180° spin; idle: face away from camera)
  rig.g.position.copy(player.pos);
  const fwdYaw = player.yaw + Math.PI;
  let faceYaw = fwdYaw;
  if (hs > 0.5) {
    let rel = Math.atan2(player.vel.x, player.vel.z) - fwdYaw;
    rel = Math.atan2(Math.sin(rel), Math.cos(rel));
    faceYaw = fwdYaw + THREE.MathUtils.clamp(rel, -2.1, 2.1);
  }
  let dyaw = faceYaw - rig.g.rotation.y;
  dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
  rig.g.rotation.y += dyaw * Math.min(1, 12 * dt);

  // TPS camera behind the head
  const cp = player.pitch, yaw = player.yaw;
  const vx = sy * Math.cos(cp), vy = Math.sin(cp), vz = -cy * Math.cos(cp);
  const head = player.pos.clone().setY(player.pos.y + player.eye - 0.1);
  const camDist = 5.4;
  let d = camDist;
  const hit = raycastPoint(head.x, head.y, head.z, -vx, -vy, -vz, camDist + 0.5);
  if (hit) d = Math.max(0.5, hit.t - 0.3);
  camera.position.set(head.x - vx * d, head.y - vy * d, head.z - vz * d);
  const look = head.clone().addScaledVector(new THREE.Vector3(vx, vy, vz), 8);
  camera.lookAt(look);
  const fovT = 74 + (sprint ? 10 : 0) + hs * 0.4;
  camera.fov += (fovT - camera.fov) * Math.min(1, 8 * dt);
  camera.updateProjectionMatrix();
}

/* ================================================================
 * destructibility: voxel raycast + debris
 * ================================================================ */
function raycastPoint(ox, oy, oz, dx, dy, dz, maxDist) {
  if (dx === 0 && dy === 0 && dz === 0) return null;
  let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
  const stepX = dx > 0 ? 1 : -1, stepY = dy > 0 ? 1 : -1, stepZ = dz > 0 ? 1 : -1;
  const tDX = dx !== 0 ? Math.abs(1 / dx) : Infinity;
  const tDY = dy !== 0 ? Math.abs(1 / dy) : Infinity;
  const tDZ = dz !== 0 ? Math.abs(1 / dz) : Infinity;
  let tMX = dx !== 0 ? (dx > 0 ? (x + 1 - ox) : (ox - x)) * tDX : Infinity;
  let tMY = dy !== 0 ? (dy > 0 ? (y + 1 - oy) : (oy - y)) * tDY : Infinity;
  let tMZ = dz !== 0 ? (dz > 0 ? (z + 1 - oz) : (oz - z)) * tDZ : Infinity;
  let t = 0;
  for (let i = 0; i < 300; i++) {
    if (tMX < tMY && tMX < tMZ) { x += stepX; t = tMX; tMX += tDX; }
    else if (tMY < tMZ) { y += stepY; t = tMY; tMY += tDY; }
    else { z += stepZ; t = tMZ; tMZ += tDZ; }
    if (t > maxDist) break;
    const b = getB(x, y, z);
    if (solid(b)) return { x, y, z, t };
  }
  return null;
}
const head2 = new THREE.Vector3(), _aimDir = new THREE.Vector3();
function aimTarget() {
  head2.set(player.pos.x, player.pos.y + player.eye - 0.1, player.pos.z);
  _aimDir.subVectors(head2, camera.position).normalize();
  return raycastPoint(camera.position.x, camera.position.y, camera.position.z,
    _aimDir.x, _aimDir.y, _aimDir.z, 32);
}

function spawnPeds(n) {

// from the corner just reached, a straight shot across one adjacent road
function crossOption(p) {
  const bx = blockStart(p.bi), bz = blockStart(p.bj);
  const opts = [];
  if (p.seg === 0) {
    if (p.bi > 0) opts.push([bx - 18.5, bz + 1.5, p.bi - 1, p.bj, 1]);
    if (p.bj > 0) opts.push([bx + 1.5, bz - 18.5, p.bi, p.bj - 1, 3]);
  } else if (p.seg === 1 && p.bj > 0) {
    opts.push([bx + BLOCK_W - 2.5, bz - 18.5, p.bi, p.bj - 1, 2]);
  } else if (p.seg === 2) {
    if (p.bi < GRID - 1) opts.push([bx + 61.5, bz + BLOCK_W - 2.5, p.bi + 1, p.bj, 3]);
    if (p.bj < GRID - 1) opts.push([bx + BLOCK_W - 2.5, bz + 61.5, p.bi, p.bj + 1, 1]);
  } else if (p.seg === 3 && p.bi > 0) {
    opts.push([bx - 18.5, bz + BLOCK_W - 2.5, p.bi - 1, p.bj, 2]);
  }
  return opts.length ? opts[(Math.random() * opts.length) | 0] : null;
}
function updatePeds(dt) {
  for (const p of peds) {
    const bx = blockStart(p.bi), bz = blockStart(p.bj);
    const pts = [
      [bx + 1.5, bz + 1.5], [bx + BLOCK_W - 2.5, bz + 1.5],
      [bx + BLOCK_W - 2.5, bz + BLOCK_W - 2.5], [bx + 1.5, bz + BLOCK_W - 2.5],
    ];
    if (p.mode === 'cross') {
      // walking straight across the road
      const dx = p.tx - p.x, dz = p.tz - p.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.4) {
        p.bi = p.toBi; p.bj = p.toBj; p.seg = p.toSeg;
        p.mode = 'ring';
        p.pause = 0.8 + Math.random() * 2;
      } else {
        const sp = p.speed * 1.3;
        p.x += dx / d * sp * dt;
        p.z += dz / d * sp * dt;
        p.facing = Math.atan2(dx, dz);
        p.phase += sp * dt * 4.4;
      }
    } else if (p.pause > 0) {
      p.pause -= dt;
      p.facing += dt * 0.6;            // idle: look around
      if (Math.abs(Math.sin(p.phase)) < 0.3) p.facing = 0;
    } else {
      const dx = B[0] - p.x, dz = B[1] - p.z;
      const d = Math.hypot(dx, dz);
      if (d < 0.4) {
        p.seg = (p.seg + 1) & 3;
        if (Math.random() < 0.35) {
          const c = crossOption(p);   // brave soul crosses the street
          if (c) { p.tx = c[0]; p.tz = c[1]; p.toBi = c[2]; p.toBj = c[3]; p.toSeg = c[4]; p.mode = 'cross'; }
          else p.pause = 1 + Math.random() * 3;
        } else if (Math.random() < 0.25) p.pause = 1 + Math.random() * 3;
        if (Math.random() < 0.12) {
          // hop to an adjacent block
          const dxi = ri(-1, 1), dzj = ri(-1, 1);
          const ni = p.bi + dxi, nj = p.bj + dzj;
          if (ni >= 0 && nj >= 0 && ni < GRID && nj < GRID) {
            p.bi = ni; p.bj = nj;
            const pts2 = [
              [blockStart(ni) + 1.5, blockStart(nj) + 1.5],
              [blockStart(ni) + BLOCK_W - 2.5, blockStart(nj) + 1.5],
              [blockStart(ni) + BLOCK_W - 2.5, blockStart(nj) + BLOCK_W - 2.5],
              [blockStart(ni) + 1.5, blockStart(nj) + BLOCK_W - 2.5],
            ];
            const np = pts2[ri(0, 3)];
            p.x = np[0]; p.z = np[1];

        }
      } else {
        p.x += dx / d * p.speed * dt;
        p.z += dz / d * p.speed * dt;
        p.facing = Math.atan2(dx, dz);
      }
      p.phase += p.speed * dt * 4.4;

    const sw = Math.sin(p.phase) * (p.pause > 0 ? 0 : 0.75);
    p.rig.legL.rotation.x = sw; p.rig.legR.rotation.x = -sw;
    p.rig.armL.rotation.x = -sw * 0.7; p.rig.armR.rotation.x = sw * 0.7;

    const gy = groundTopAt(Math.floor(p.x), Math.floor(p.z));
    p.y += (gy - p.y) * Math.min(1, 8 * dt);
    p.rig.g.position.set(p.x, p.y, p.z);
    p.rig.g.rotation.y = p.pause > 0 ? Math.sin(p.phase * 0.5) * 0.4 : p.facing;
  }
}

                     (d[1] === 1 && car.rz === 4) || (d[1] === -1 && car.rz === 0);
  const tL = d => [d[1], -d[0]], tR = d => [-d[1], d[0]];

    const a = tL(car.dir), b = tR(car.dir);
    const pick = r < 0.75 ? a : b;
    car.dir = exits(pick) ? (exits(a) ? b : a) : pick;           // 50% straight, else turn
  }
  const [ox, oz] = laneOffset(car.dir);
  const cxi = car.ri, czi = car.rz;
  car.fx = ROAD_C(cxi) + ox; car.fz = ROAD_C(czi) + oz;      // from (intersection center + lane)
  car.tx = car.fx + car.dir[0] * 60;
  car.tz = car.fz + car.dir[1] * 60;

    // yield to stolen / parked cars and the player on foot
    for (const o of cars) {
      if (o === car || !o.parked) continue;
      if (Math.hypot(o.x - car.x, o.z - car.z) < 3.4) v = 0;
    }
    if (drivingCar && Math.hypot(drivingCar.x - car.x, drivingCar.z - car.z) < 3.6) v = 0;
    if (!drivingCar && Math.hypot(player.pos.x - car.x, player.pos.z - car.z) < 2.2) v = 0;
    if (car.stopAt > 0) {
      if (car.stopped) { car.stopT -= dt; if (car.stopT <= 0) { car.stopAt = 0; car.stopped = false; } else v = 0; }
      else if (dist < car.stopAt) { car.stopped = true; v = 0; }
    }
    if (dist < 14) v = Math.min(v, 3.2);          // slow for the junction
    car.speed += (v - car.speed) * Math.min(1, (v < car.speed ? 5 : 2.2) * dt);
    if (dist < 1.2) {
      // arrived at intersection: next leg
      car.ri += car.dir[0]; car.rz += car.dir[1];
      car.ri = (car.ri + 5) % 5; car.rz = (car.rz + 5) % 5;
      setupCarLeg(car);
      car.x = car.fx; car.z = car.fz;
    } else {
      car.x += dx / dist * car.speed * dt;
      car.z += dz / dist * car.speed * dt;
    }
    // AI drivers are not careful
    for (const p of peds.slice())
      if (Math.hypot(p.x - car.x, p.z - car.z) < 1.4) flingPed(p, car);
    car.g.position.set(car.x, 2.955, car.z);   // wheel bottoms land on road top (y=3)
    const targetYaw = Math.atan2(car.dir[0], car.dir[1]);
    let dy = targetYaw - car.g.rotation.y;
    while (dy > Math.PI) dy -= Math.PI * 2;
    while (dy < -Math.PI) dy += Math.PI * 2;
    car.g.rotation.y += dy * Math.min(1, 6 * dt);
  }
}

/* ================================================================
 * carjacking: E to steal a car and drive it (arcade physics)
 * ================================================================ */
let drivingCar = null, nearCar = null, respawnT = 15, pedRespawnT = 10;
let wanted = 0, wantedT = 0, lastWanted = 0, busted = false, bustTextT = 0;
const ejected = [];
const bustedEl = document.getElementById('busted');

function addWanted(n = 1) {
  wanted = Math.min(3, wanted + n);
  wantedT = 25;
}
function pushEject(e) {
  ejected.push(e);
  if (ejected.length > 30) {
    const i = ejected.findIndex(x => !x.isPlayer);
    if (i >= 0) { scene.remove(ejected[i].g); ejected.splice(i, 1); }
  }
}

function groundTopAt(x, z) {
  for (let y = 0; y < 12; y++)
    if (solid(getB(x, y, z)) && !solid(getB(x, y + 1, z))) return y + 1;
  return 3;
}
function findNearCar() {
  let best = null, bd = 3.4;
  for (const c of cars) {
    if (c.police) continue;   // no stealing police cars
    const d = Math.hypot(c.x - player.pos.x, c.z - player.pos.z);
    if (d < bd) { bd = d; best = c; }
  }
  return best;
}
function enterCar(car) {
  if (!car) return;
  drivingCar = car;
  car.parked = false;
  car.stopAt = 0; car.stopped = false;   // keep momentum
  rig.g.visible = false;
  player.pos.set(car.x, car.gy ?? groundTopAt(Math.floor(car.x), Math.floor(car.z)), car.z);
  player.yaw = car.g.rotation.y;
  player.vel.set(0, 0, 0);
}
function exitCar() {
  const car = drivingCar; drivingCar = null;
  car.parked = true; car.speed = 0;
  const h = car.g.rotation.y, fx = Math.sin(h), fz = Math.cos(h);
  const rx = -fz, rz = fx;
  let placed = false;
  for (const s of [1, -1]) {
    const ex = car.x + rx * 2.4 * s, ez = car.z + rz * 2.4 * s;
    const y = groundTopAt(Math.floor(ex), Math.floor(ez));
    player.pos.set(ex, y, ez);
    if (y < 6 && !collides(ex, y, ez)) { placed = true; break; }
  }
  if (!placed) player.pos.set(car.x, groundTopAt(Math.floor(car.x), Math.floor(car.z)), car.z);
  player.vel.set(0, 0, 0);
  player.onGround = true;
  rig.g.visible = true;
}
// fling the driver out of the car (GTA1 style carjacking)
function ejectDriver(car) {
  const d = car.driver;
  car.driver = null;
  if (!d) return;
  const h = car.g.rotation.y;
  const fx = Math.sin(h), fz = Math.cos(h);
  const rx = -fz, rz = fx;
  car.g.updateMatrixWorld();
  d.position.copy(car.g.localToWorld(new THREE.Vector3(0, 1.1, -0.35)));
  d.removeFromParent();
  scene.add(d);
  pushEject({
    g: d, v,
    w: new THREE.Vector3((Math.random() - 0.5) * 7, (Math.random() - 0.5) * 9, (Math.random() - 0.5) * 7),
    settled: false,
  });
}
function updateEjected(dt) {
  for (const e of ejected) {
    if (e.settled) continue;
    e.v.y -= 22 * dt;
    e.g.position.addScaledVector(e.v, dt);
    e.g.rotation.x += e.w.x * dt;
    e.g.rotation.y += e.w.y * dt;
    e.g.rotation.z += e.w.z * dt;
    const gy = groundTopAt(Math.floor(e.g.position.x), Math.floor(e.g.position.z));
    if (e.g.position.y <= gy) {
      e.settled = true;
      e.g.position.y = gy + 0.1;
      e.g.rotation.x = -Math.PI / 2;
      if (e.isPlayer) {
        // back on your feet: control returns
        e.g.rotation.set(0, player.yaw, 0);
        player.pos.set(e.g.position.x, gy, e.g.position.z);
        player.vel.set(0, 0, 0);
        player.onGround = true;
        busted = false;
        bustTextT = 2;
      }
    }
  }
}
// police: wanted stars, pursuit, busts
function copRetreat(car) {
  car.ri = ri(0, 4); car.rz = ri(0, 4);
  car.x = ROAD_C(car.ri); car.z = ROAD_C(car.rz);
  setupCarLeg(car);
  car.speed = 0; car.stuckT = 0; car.bustT = 0;
  car.g.rotation.y = Math.atan2(car.dir[0], car.dir[1]);
}
function bustPlayer(fromX, fromZ) {
  if (busted) return;
  busted = true;
  const car = drivingCar;
  if (car) {   // car impounded
    const ci = cars.indexOf(car);
    if (ci >= 0) cars.splice(ci, 1);
    scene.remove(car.g);
    drivingCar = null;
  }
  let dx = player.pos.x - fromX, dz = player.pos.z - fromZ;
  const d = Math.hypot(dx, dz) || 1;
  rig.g.visible = true;
  rig.g.position.set(player.pos.x, player.pos.y, player.pos.z);
  for (const part of [rig.legL, rig.legR, rig.armL, rig.armR]) part.rotation.x = 0;
  pushEject({
    g: rig.g,
    v: new THREE.Vector3(dx / d * 4, 3, dz / d * 4),
    w: new THREE.Vector3(4, 6, 4),
    settled: false, isPlayer: true,
  });
  wanted = 0; wantedT = 0;
}
function policePursuit(car, dt) {
  const g = car.g;
  const dx = player.pos.x - car.x, dz = player.pos.z - car.z;
  const dist = Math.hypot(dx, dz);
  const wantYaw = Math.atan2(dx, dz);
  let dy = wantYaw - g.rotation.y;
  dy = Math.atan2(Math.sin(dy), Math.cos(dy));
  g.rotation.y += THREE.MathUtils.clamp(dy, -2.6 * dt, 2.6 * dt);
  const h = g.rotation.y, fx = Math.sin(h), fz = Math.cos(h);
  const targetV = (drivingCar || dist > 8) ? 19 : 0;
  car.speed += (targetV - car.speed) * Math.min(1, 3 * dt);
  const nx = car.x + fx * car.speed * dt, nz = car.z + fz * car.speed * dt;
  const rx = -fz, rz = fx;
  let blocked = false;
  for (const [ox, oz] of CAR_PTS) {
    const wx = nx + fx * oz + rx * ox, wz = nz + fz * oz + rz * ox;
    for (let y = 4; y < 6 && !blocked; y++)
      if (solid(getB(Math.floor(wx), y, Math.floor(wz)))) blocked = true;
    if (blocked) break;
  }
  if (blocked) {
    car.speed = 0;
    car.stuckT = (car.stuckT || 0) + dt;
    if (car.stuckT > 1.2) { car.stuckT = 0; g.rotation.y += Math.PI / 2; }
  } else {
    car.x = THREE.MathUtils.clamp(nx, 4, WORLD - 4);
    car.z = THREE.MathUtils.clamp(nz, 4, WORLD - 4);
    car.stuckT = 0;
  }
  // bust: ram the driven player, or sit on the foot player until they freeze
  if (drivingCar) {
    if (dist < 3.2 && car.speed > 4) bustPlayer(car.x, car.z);
  } else {
    if (dist < 3.5) {
      car.bustT = (car.bustT || 0) + dt;
      if (car.bustT > 1.5) bustPlayer(car.x, car.z);
    } else car.bustT = 0;
  }
  const gy = groundTopAt(Math.floor(car.x), Math.floor(car.z));
  car.gy = (car.gy ?? gy) + (gy - (car.gy ?? gy)) * Math.min(1, 8 * dt);
  g.position.set(car.x, car.gy - 0.045, car.z);
}
// driverless parked cars coast to a stop
function coastCar(car, dt) {
  if (!car.speed) return;
  car.speed -= car.speed * 2.5 * dt;
  if (Math.abs(car.speed) < 0.15) { car.speed = 0; return; }
  const h = car.g.rotation.y, fx = Math.sin(h), fz = Math.cos(h);
  car.x = THREE.MathUtils.clamp(car.x + fx * car.speed * dt, 4, WORLD - 4);
  car.z = THREE.MathUtils.clamp(car.z + fz * car.speed * dt, 4, WORLD - 4);
  const gy = groundTopAt(Math.floor(car.x), Math.floor(car.z));
  car.gy = (car.gy ?? gy) + (gy - (car.gy ?? gy)) * Math.min(1, 8 * dt);
  car.g.position.set(car.x, car.gy - 0.045, car.z);
}
const CAR_PTS = [[0, 0], [1, 1.7], [-1, 1.7], [1, -1.7], [-1, -1.7]];
function updateDriving(dt) {
  const car = drivingCar, g = car.g, k = keys;
  const throttle = k['KeyW'] || k['ArrowUp'];
  const brake = k['KeyS'] || k['ArrowDown'];
  const steer = ((k['KeyD'] || k['ArrowRight']) ? 1 : 0) - ((k['KeyA'] || k['ArrowLeft']) ? 1 : 0);
  const boost = k['ShiftLeft'] || k['ShiftRight'];
  const hand = k['Space'];
  const maxV = boost ? 24 : 15;
  if (throttle) car.speed += (car.speed < 0 ? 26 : 9) * dt * Math.max(0.15, 1 - car.speed / maxV);
  else if (brake) car.speed -= (car.speed > 0 ? 22 : 5) * dt;
  else car.speed -= car.speed * 1.1 * dt;
  if (hand) car.speed -= car.speed * 6 * dt;
  car.speed = THREE.MathUtils.clamp(car.speed, -5, maxV);

  const heading = g.rotation.y + steer * Math.min(1, Math.abs(car.speed) / 5) * 1.9 * dt * Math.sign(car.speed || 1);
  const fx = Math.sin(heading), fz = Math.cos(heading), rx = -fz, rz = fx;
  const nx = THREE.MathUtils.clamp(car.x + fx * car.speed * dt, 4, WORLD - 4);
  const nz = THREE.MathUtils.clamp(car.z + fz * car.speed * dt, 4, WORLD - 4);

  // hit: walls / trees at block level + any other car
  let blocked = false, rammed = false;
  for (const [ox, oz] of CAR_PTS) {
    const wx = nx + fx * oz + rx * ox, wz = nz + fz * oz + rz * ox;
    for (let y = 4; y < 6 && !blocked; y++)
      if (solid(getB(Math.floor(wx), y, Math.floor(wz)))) blocked = true;
    if (blocked) break;
  }
  if (!blocked) for (const o of cars) {
    if (o === car || !o.g) continue;
    if (Math.hypot(o.x - nx, o.z - nz) < 2.7) { blocked = true; rammed = o.police; break; }
  }
  if (blocked) {
    if (Math.abs(car.speed) > 7)
      spawnDebris(car.x + fx * 1.6, 3, car.z + fz * 1.6, g.children[0].material.color.getHex());
    if (rammed && Math.abs(car.speed) > 5) addWanted(1);   // crime: ramming the cops
    car.speed *= -0.3;
  } else { car.x = nx; car.z = nz; }

  // pedestrians: the car barely notices
  for (const p of peds.slice()) {
    if (Math.hypot(p.x - car.x, p.z - car.z) < 1.7) { flingPed(p, car); car.speed *= 0.88; }
  }

  // snap to the ground (curbs, sidewalks): wheels ride the surface
  const gy = groundTopAt(Math.floor(car.x), Math.floor(car.z));
  car.gy = car.gy === undefined ? gy : car.gy + (gy - car.gy) * Math.min(1, 8 * dt);
  g.rotation.y = heading;
  g.position.set(car.x, car.gy - 0.045, car.z);

  // keep player state in sync so sun / clouds / exit all work
  player.pos.set(car.x, car.gy, car.z);
  player.yaw = heading; player.pitch = 0.1;
  player.onGround = true; player.speed = car.speed;
  player.vel.set(0, 0, 0);

  // follow camera
  const ck = 1 - Math.exp(-6 * dt);
  camera.position.x += (car.x - fx * 7 - camera.position.x) * ck;
  camera.position.y += (car.gy + 3.4 - camera.position.y) * ck;
  camera.position.z += (car.z - fz * 7 - camera.position.z) * ck;
  camera.lookAt(car.x + fx * 6, car.gy + 2, car.z + fz * 6);
  const fovT = 74 + Math.abs(car.speed) * 0.9;
  camera.fov += (fovT - camera.fov) * Math.min(1, 8 * dt);
  camera.updateProjectionMatrix();
}

spawnPeds(26);
spawnCars(15);

/* ================================================================
 * HUD + input
 * ================================================================ */
const overlay = document.getElementById('overlay');
const crosshair = document.getElementById('crosshair');
const statusEl = document.getElementById('status');
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
  if (e.code === 'KeyE' && playing) {
    if (drivingCar) exitCar();
    else if (nearCar) {
      if (nearCar.driver) { ejectDriver(nearCar); nearCar.parked = true; addWanted(1); }
      else enterCar(nearCar);
    }
  }
});
document.addEventListener('keyup', e => { keys[e.code] = false; });

overlay.addEventListener('click', () => {
  const c = renderer.domElement;
  if (!document.pointerLockElement) c.requestPointerLock();
});
document.addEventListener('pointerlockchange', () => {
  playing = !!document.pointerLockElement;
  overlay.style.display = playing ? 'none' : 'flex';
  crosshair.style.opacity = playing ? 1 : 0;
  statusEl.style.display = 'none';
});
document.addEventListener('mousemove', e => {
  if (!playing || drivingCar) return;
  player.yaw += e.movementX * 0.0023;
  player.pitch = THREE.MathUtils.clamp(player.pitch + e.movementY * 0.0023, -1.45, 1.45);
});
let mouseDown = false, breakCooldown = 0;
document.addEventListener('mousedown', e => {
  if (!playing || e.button !== 0) return;
  mouseDown = true;
  breakBlock();
});
document.addEventListener('mouseup', e => { if (e.button === 0) mouseDown = false; });

let hudTimer = 0;
const hintEl = document.getElementById('hint');
function updateHud(dt) {
  hudTimer -= dt;
  if (hudTimer > 0) return;
  hudTimer = 0.25;
  const hour = (10 + simTime * 24 / 480) % 24;
  const hh = Math.floor(hour), mm = Math.floor((hour - hh) * 60);
  const icons = { sun: '☀', rain: '🌧', snow: '❄', fog: '🌫' };
  const w = weather.target;
  statusEl.innerHTML =
    `<span style="color:#fff">${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}</span> ` +
    `${icons[w]} ${weather.word}` +
    (wanted > 0 ? `<br><span style="color:#ffd75e">${'★'.repeat(wanted)}</span>` : '') +
    (mpApi ? `<br><span style="color:#7fd08a">👥 ${mpApi.onlineCount}</span>` : '');
  statusEl.style.display = playing ? 'block' : 'none';
  // aim highlight
  const t = playing && !drivingCar ? aimTarget() : null;
  if (t && DESTRUCTIBLE[getB(t.x, t.y, t.z)]) {
    hl.visible = true;
    hl.position.set(t.x + 0.5, t.y + 0.5, t.z + 0.5);
  } else hl.visible = false;
  // context hint
  let hint = '';
  if (playing) {
    if (drivingCar) hint = 'W/\u2191 drive \u00b7 S/\u2193 brake / reverse \u00b7 A/D steer \u00b7 Shift boost \u00b7 Space brake \u00b7 E get out';
    else if (nearCar) hint = nearCar.driver ? 'E \u2014 throw the driver out' : 'E \u2014 steal this car';
  }
  hintEl.textContent = hint;
  hintEl.style.display = hint ? 'block' : 'none';
}

/* ================================================================
 * main loop
 * ================================================================ */
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (playing && !busted) {
    if (drivingCar) updateDriving(dt);
    else { updatePlayer(dt); breakIfHeld(dt); }
  }
  nearCar = playing && !drivingCar && !busted ? findNearCar() : null;
  // wanted level decays one star per clean 20 s
  if (wanted > 0) { wantedT -= dt; if (wantedT <= 0) { wanted--; wantedT = 20; } }
  if (wanted === 0 && lastWanted > 0)
    for (const c of cars) if (c.police && !c.parked && c !== drivingCar) copRetreat(c);
  lastWanted = wanted;
  bustTextT -= dt;
  bustedEl.style.display = bustTextT > 0 ? 'block' : 'none';
  // police light bar
  const now2 = performance.now();
  const fl = wanted > 0 ? (Math.sin(now2 * 0.02) > 0 ? 1 : 0.12) : 0.3;
  const fl2 = wanted > 0 ? (Math.sin(now2 * 0.02) > 0 ? 0.12 : 1) : 0.3;
  policeRedM.color.setRGB(fl, fl * 0.04, fl * 0.06);
  policeBlueM.color.setRGB(fl2 * 0.06, fl2 * 0.08, fl2);
  for (const c of cars) if (c.parked && c !== drivingCar) coastCar(c, dt);
  updateEjected(dt);
  respawnT -= dt;
  if (respawnT <= 0) {
    respawnT = 15;
    let active = 0;
    for (const c of cars) if (!c.parked && c !== drivingCar) active++;
    if (active < 12 && cars.length < 24) spawnCars(1);
  }
  pedRespawnT -= dt;
  if (pedRespawnT <= 0) {
    pedRespawnT = 10;
    if (peds.length < 26) spawnPeds(1);
  }
  updatePeds(dt);
  updateCars(dt);
  updateEnvironment(dt);
  updateDebris(dt);
  updateHud(dt);
  renderer.render(scene, camera);
}
// hold left mouse: continuous breaking
function breakIfHeld(dt) {
  if (!mouseDown) return;
  breakCooldown -= dt;
  if (breakCooldown <= 0) { breakBlock(); breakCooldown = 0.28; }
}

requestAnimationFrame(loop);

/* ================================================================
 * multiplayer (optional): ?mp=host:port -> ServerBase/VibeGTAPlugin
 * ================================================================ */
let mpApi = null;
{
  const mpUrl = new URLSearchParams(location.search).get('mp');
  if (mpUrl) {
    const gta = await import('./lib/gta.js');
    mpApi = gta.attachGta({
      player, scene,
      url: mpUrl,
      // remote block edits land in the world grid here; gta.js throttles
      // the (expensive) chunk remesh itself
      applyRemoteBlock: (x, y, z, t) => { setB(x, y, z, t); },
      rebuildAround,
    });
  }
}
